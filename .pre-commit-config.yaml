repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.6.3
    hooks:
      - id: biome-check
        args: [--error-on-warnings]

  - repo: local
    hooks:
      - id: bun-lockfile-check
        name: Verify bun.lock is in sync
        entry: bun install --frozen-lockfile --dry-run
        language: system
        files: ^(package\.json|bun\.lock)$
        pass_filenames: false
